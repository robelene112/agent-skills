name: Validate and update skills

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/update-matt-pocock.py --check
      - run: python -m unittest discover -s tests -v

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: matt-pocock-updates
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch and validate upstream skills
        run: python scripts/update-matt-pocock.py --summary-file "$RUNNER_TEMP/matt-update.md"
      - name: Create or refresh the update pull request
        shell: bash
        run: |
          set -euo pipefail
          branch=automation/matt-pocock-updates
          if git diff --quiet -- vendor/matt-pocock && [ -z "$(git ls-files --others --exclude-standard vendor/matt-pocock)" ]; then
            echo "No upstream skill changes."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/$branch" && git diff --quiet "origin/$branch" -- vendor/matt-pocock && git merge-base --is-ancestor origin/main "origin/$branch"; then
            echo "The existing update branch already contains this snapshot."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add -- vendor/matt-pocock
          git commit -m 'Update Matt Pocock skills'
          git push --force-with-lease origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr edit "$branch" --title 'Update Matt Pocock skills' --body-file "$RUNNER_TEMP/matt-update.md"
          else
            gh pr create --base main --head "$branch" --title 'Update Matt Pocock skills' --body-file "$RUNNER_TEMP/matt-update.md"
          fi
